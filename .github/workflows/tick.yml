name: CHRONICON Tick

on:
  schedule:
    # 4x denně: 6:00, 12:00, 18:00, 00:00 UTC+1 (Prague)
    # GitHub Actions cron běží v UTC — odečti 1h (v létě CEST = UTC+2, odečti 2h)
    - cron: '0 4,10,16,22 * * *'
  workflow_dispatch:
    # Manuální spuštění z GitHub UI (tlačítko Run workflow)

jobs:
  tick:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run CHRONICON tick
        run: node cron.js --once

      # Retry smyčka místo git-auto-commit-action — actor-favor/rescue/vrchnost/
      # registrum/contact-relation/library-fond report umí commitnout na main
      # v rychlém sledu (viz diagnostika 4.9.2026), git-auto-commit-action sám
      # retry neumí, proto vlastní smyčka s pull --rebase mezi pokusy.
      - name: Commit and push snapshot (with retry)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git add data/chronicon_snapshot.json data/gamestate.json
            git diff --cached --quiet && { echo "Nothing to commit."; break; }
            git commit -m "chronicon: tick"
            if git push origin HEAD:main; then
              echo "Pushed OK."
              break
            fi
            echo "Push rejected, retry $i..."
            git reset --soft HEAD~1
            git pull --rebase --autostash origin main
            sleep $((RANDOM % 3 + 1))
          done
